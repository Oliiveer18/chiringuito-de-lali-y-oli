name: Management model checks
on:
  push:
    branches: [main]
    paths: ['management-model.mjs', 'management-model.test.mjs', '.github/workflows/management-model-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test management-model.test.mjs
