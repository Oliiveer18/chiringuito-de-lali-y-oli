name: Apply tested service fixes v24
on:
  push:
    branches: [main]
    paths: [apply-service-v24.py, .github/workflows/service-v24.yml]
permissions:
  contents: write
concurrency:
  group: service-fixes-v24
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pure models
        run: node service-v24.test.mjs
      - name: Apply exact checked edits
        run: python3 apply-service-v24.py
      - name: Test rejection in plan and delivery during service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('smoke.test.mjs')
          s=p.read_text()
          old="delete Game.upgrades.deliveryItem; const m5 = Game.money; guest('delivery', { id: 'cerveza', qty: 9999 });"
          new="delete Game.upgrades.deliveryItem; const planMoney = Game.money; guest('delivery', { id: 'cerveza', qty: 5 });\ncheck('el reparto se rechaza durante la preparación sin cobrar', !Game.upgrades.deliveryItem && Game.money === planMoney);\nGame.mode = 'service'; const m5 = Game.money; guest('delivery', { id: 'cerveza', qty: 9999 });"
          if s.count(old)!=1: raise RuntimeError('Contexto de prueba de reparto no encontrado una sola vez')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Check modified JavaScript syntax
        run: |
          for f in sim.js render.js report.js v12.js chiringo-ui.js game.js beach.js delivery-panel.js scene-extras.js; do
            node --experimental-default-type=module --check "$f"
          done
      - name: Run existing regression suite
        run: |
          node --experimental-default-type=module smoke.test.mjs
          node social-model.test.mjs
          node --experimental-default-type=module career.test.mjs
          node progression.test.mjs
          node market.test.mjs
      - name: Commit only after tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim.js render.js report.js v12.js chiringo-ui.js game.js index.html progression.test.mjs smoke.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Apply v24 service fixes after regression tests"
          git push origin HEAD:main
