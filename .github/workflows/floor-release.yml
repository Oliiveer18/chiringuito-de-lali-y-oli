name: Physical terrace service v27.0
on:
  push:
    branches: [main]
    paths: ['apply-floor.py', '.github/workflows/floor-release.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 apply-floor.py
      - name: Syntax and task regressions
        run: |
          for f in *.js *.mjs; do node --check "$f"; done
          node --test service-tasks.test.mjs management-model.test.mjs social-model.test.mjs
      - name: Install browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Test physical cleaning and full table service
        run: |
          mkdir -p /tmp/floor-results
          python3 -m http.server 8765 >/tmp/floor-http.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium,webkit} from 'playwright';
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const results=[];
          for(const [engine,type]of [['chromium',chromium],['webkit',webkit]]){const browser=await type.launch();try{for(const viewport of [{width:390,height:844},{width:844,height:390}]){
            const page=await browser.newPage({viewport});const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('dialog',d=>d.accept());await page.goto('http://localhost:8765/');await page.waitForFunction(()=>document.querySelector('#ver-title')?.textContent.includes('v27.0 · activas:'));
            await page.evaluate(async()=>{const sim=await import('./sim.js?v=27.0');sim.newSeason();sim.startDay();Game.speed=0;Game.eventDone=true;Game.spawnAcc=-1e6;});
            const cleaned=await page.evaluate(async()=>{const sim=await import('./sim.js?v=27.0');const t=Game.tables[0];t.state='dirty';sim.cleanTable(t,false,'p1');sim.cleanTable(t,false,'p1');const instant=t.state;sim.update(.05);const before=Game.floor.actors.find(a=>a.id==='p1').x;for(let i=0;i<700&&t.state!=='free';i++)sim.update(.05);return {instant,state:t.state,cleaned:Game.dayStats.cleaned,moved:Math.abs(Game.floor.actors.find(a=>a.id==='p1').x-before)>1,tasks:Game.floor.tasks.filter(t=>t.kind==='clean').length};});assert.equal(cleaned.instant,'dirty');assert.equal(cleaned.state,'free');assert.equal(cleaned.cleaned,1);assert.equal(cleaned.tasks,1);assert.ok(cleaned.moved);
            const automatic=await page.evaluate(async()=>{const sim=await import('./sim.js?v=27.0');Game.staff.limpiador=true;sim.startDay();Game.speed=0;Game.eventDone=true;Game.spawnAcc=-1e6;Game.tables[0].state='dirty';for(let i=0;i<700&&Game.tables[0].state!=='free';i++)sim.update(.05);return {state:Game.tables[0].state,actor:Game.floor.tasks.find(t=>t.kind==='clean')?.actor};});assert.deepEqual(automatic,{state:'free',actor:'acaymo'});
            const served=await page.evaluate(async()=>{const sim=await import('./sim.js?v=27.0');Game.staff={terraza:true};sim.startDay();Game.speed=0;Game.eventDone=true;Game.spawnAcc=-1e6;sim.spawnCustomer('local');const c=Game.customers.at(-1);Object.assign(c,{state:'queue',spot:0,x:434,y:600,tx:434,ty:600,path:null,personality:'tranquilo',order:['cerveza','papas'],itemSt:[0,0],served:[],inPrep:0,subs:{},patience:200,maxPatience:200});if(c.id%3===1)c.id+=1000001;const stock={...Game.stock},money=Game.money;for(let i=0;i<2400&&!c.floorPaid;i++)sim.update(.05);return {paid:!!c.floorPaid,state:c.state,served:Game.dayStats.served,stockDrink:stock.cerveza-Game.stock.cerveza,stockFood:stock.papas-Game.stock.papas,gained:Game.money-money,tickets:Game.floor.tickets.filter(t=>t.paid).length};});assert.equal(served.paid,true);assert.equal(served.state,'eat');assert.equal(served.served,1);assert.equal(served.stockDrink,1);assert.equal(served.stockFood,1);assert.equal(served.tickets,1);assert.ok(served.gained>0);assert.deepEqual(errors,[]);
            await page.screenshot({path:'/tmp/floor-results/'+engine+'-'+viewport.width+'.png',fullPage:true});results.push({engine,viewport,ok:true,checks:['non-instant-clean','movement','single-clean-task','automatic-cleaner','escort','table-order','mixed-preparation','physical-delivery','single-payment']});await page.close();
          }}finally{await browser.close();}}
          writeFileSync('/tmp/floor-results/results.json',JSON.stringify(results));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor-service-results
          path: /tmp/floor-results
      - name: Commit tested integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/floor-results/results.json diagnostics/floor-build-result.json
          git add '*.js' '*.mjs' index.html diagnostics/floor-build-result.json
          git commit -m 'v27.0: integrate physical workers, table cleaning and terrace tickets'
          git push origin HEAD:main
          rsync -a --exclude=.git --exclude=node_modules --exclude=.github ./ /tmp/floor-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/floor-site
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify public HTML
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          ok=0
          for n in $(seq 1 12); do
            if curl -fsS "${PAGE_URL}?check=${GITHUB_SHA}-${n}" | grep -q 'game.js?v=27.0'; then ok=1; break; fi
            sleep 15
          done
          test "$ok" = 1
          python3 -c 'import json,os;json.dump({"version":"27.0","url":os.environ["PAGE_URL"],"publicHtmlVerified":True},open("diagnostics/floor-publication.json","w"))'
          git add diagnostics/floor-publication.json
          git commit -m 'Record verified public v27.0 deployment'
          git push origin HEAD:main
