name: Professional v26.1 release
on:
  push:
    branches: [main]
    paths: ['apply-professional.py', '.github/workflows/professional-release.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 apply-professional.py
      - name: Syntax and model checks
        run: |
          for f in *.js *.mjs; do node --check "$f"; done
          node --test management-model.test.mjs social-model.test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import * as P from './professional-model.mjs';
          import * as M from './management-model.mjs';
          import * as R from './market-model.mjs';
          assert.equal(P.reconcileCalendar({last:3,idle:7},3).idle,3);
          for(const c of M.candidates('test',1)){const p=P.profile(c);assert.ok(P.portrait(p).startsWith('data:image/svg+xml'));assert.ok(P.factor(p,[{station:'barra',complex:false}])>0);assert.equal(P.trainChoice(p,500).cash,400);}
          let s=R.migrate('test'),history=[];
          for(let d=1;d<=70;d++){history.push({day:d,served:20,lost:2,rating:4,revenue:200,profit:60,followers:100});s=R.review(R.step(s,d,{weather:'sol'}),d,history,'Test');for(const a of s.groups)for(const t of a)assert.equal(t.length,10);if(d%7===0){assert.equal(s.results[0].score,M.weeklyPoints(history,d).total);assert.equal(R.review(s,d,history,'Test'),s);assert.equal(M.weeklyPoints(history,d+1).total,0);}}
          assert.equal(s.weeklyHistory.length,10);
          JS
      - name: Install browser tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Browser and saved-state checks
        run: |
          mkdir -p /tmp/professional-results
          python3 -m http.server 8765 >/tmp/professional-http.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium,webkit} from 'playwright';
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const results=[];
          for(const [engine,type] of [['chromium',chromium],['webkit',webkit]]){const browser=await type.launch();try{for(const viewport of [{width:390,height:844},{width:844,height:390}]){
            const page=await browser.newPage({viewport});const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('dialog',d=>d.accept());
            await page.goto('http://localhost:8765/');await page.waitForFunction(()=>document.querySelector('#ver-title')?.textContent.includes('v26.1 · activas:'));
            await page.locator('#btn-start').click();await page.locator('.save-browser').getByRole('button',{name:'Nueva partida',exact:true}).click();
            await page.locator('[data-tab=personal]').click();await page.locator('[data-candidate]').first().waitFor();assert.equal(await page.locator('[data-candidate]').count(),6);await page.locator('[data-manage=hire]').first().click();
            const replay=await page.evaluate(async()=>{const m=await import('./management-ui.js?v=26.1');const e=Object.values(Game.upgrades.workforce.team)[0],cash=Game.money,a={action:'train',id:e.role,day:Game.day,requestId:'test-training',expectedEmployee:e.id,expectedTraining:e.training};m.applyManagementAction(a);m.applyManagementAction(a);m.applyManagementAction({...a,requestId:'second-client'});return {spent:cash-Game.money,level:Game.upgrades.workforce.team[e.role].training};});assert.deepEqual(replay,{spent:100,level:1});
            await page.waitForFunction(()=>{const a=JSON.parse(localStorage.getItem('lali-oli.library.v2')||'[]');return a.some(s=>Object.values(s.data.upgrades.workforce?.team||{}).some(e=>e.training===1));});
            await page.reload();await page.waitForFunction(()=>document.querySelector('#ver-title')?.textContent.includes('v26.1 · activas:'));await page.locator('#btn-start').click();await page.locator('.save-row').first().getByRole('button',{name:'Continuar',exact:true}).click();await page.locator('[data-tab=personal]').click();await page.locator('[data-manage=train]').first().waitFor();assert.equal(await page.evaluate(()=>Object.values(Game.upgrades.workforce.team)[0].training),1);
            await page.evaluate(()=>{Game.upgrades.lastReport=JSON.stringify({day:1,top:'INFORME-CHECK'});});for(let i=0;i<3;i++){await page.locator('[data-tab=informe]').click();await page.getByText('INFORME-CHECK',{exact:true}).waitFor();await page.locator('[data-tab=compras]').click();}
            await page.locator('[data-tab=mercado]').click();await page.getByRole('heading',{name:'Puntos de cada jornada'}).waitFor();
            await page.locator('[data-tab=chiringo]').click();await page.locator('[data-sel=atardecer]').click();await page.locator('[data-post=atardecer]').click();await page.locator('.cs-post').waitFor();
            await page.evaluate(async()=>{Game.dayStats={served:10,sold:{},stockOuts:{},by:{}};Game.mode='report';(await import('./v12.js?v=26.1')).closeSocialDay();(await import('./ui.js?v=26.1')).showPlan();});await page.locator('.photo-thread article').first().waitFor();await page.locator('[data-choice=thanks]').first().click();await page.locator('.photo-thread blockquote').waitFor();assert.deepEqual(errors,[]);
            await page.screenshot({path:'/tmp/professional-results/'+engine+'-'+viewport.width+'.png',fullPage:true});results.push({engine,viewport,ok:true,checks:['recruitment','training-replay','stale-client-rejection','save-restore','report-reopen','league-breakdown','photo-reply']});await page.close();
          }}finally{await browser.close();}}
          writeFileSync('/tmp/professional-results/results.json',JSON.stringify(results));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professional-results
          path: /tmp/professional-results
      - name: Commit checked release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/professional-results/results.json diagnostics/professional-build-result.json
          git add '*.js' '*.mjs' index.html diagnostics/professional-build-result.json
          git commit -m 'v26.1: specialist profiles, photo conversations, migration audit and league detail'
          git push origin HEAD:main
          rsync -a --exclude=.git --exclude=node_modules --exclude=.github ./ /tmp/professional-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/professional-site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public version and record result
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          ok=0
          for n in $(seq 1 12); do
            if curl -fsS "${PAGE_URL}?check=${GITHUB_SHA}-${n}" | grep -q 'game.js?v=26.1'; then ok=1; break; fi
            sleep 15
          done
          test "$ok" = 1
          python3 -c 'import json,os,datetime;json.dump({"version":"26.1","url":os.environ["PAGE_URL"],"publicHtmlVerified":True,"checkedAt":datetime.datetime.now(datetime.timezone.utc).isoformat()},open("diagnostics/professional-publication.json","w"))'
          git add diagnostics/professional-publication.json
          git commit -m 'Record verified public v26.1 deployment'
          git push origin HEAD:main
