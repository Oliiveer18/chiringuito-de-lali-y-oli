name: Validate and publish v25.7.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-release.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare consistent module URLs and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          report = Path('report.js').read_text()
          for symbol in ['Rev', 'buildRevModel', 'reviewsSectionHtml']:
              assert re.search(r'export\s+(?:const|let|var|function)\s+' + symbol + r'\b', report), symbol
          pattern = re.compile(r"(['\"])(\.\.?/[^'\"]+\.(?:js|mjs))(?:\?[^'\"]*)?\1")
          for p in list(Path('.').glob('*.js')) + list(Path('.').glob('*.mjs')):
              if '.test.' in p.name:
                  continue
              text = pattern.sub(lambda m: m[1] + m[2] + '?v=25.7.1' + m[1], p.read_text())
              if p.name == 'game.js':
                  text = re.sub(r"title.textContent='v[0-9.]+", "title.textContent='v25.7.1", text)
              p.write_text(text)
          p = Path('index.html')
          text = re.sub(r'game\.js\?v=[^\"]+', 'game.js?v=25.7.1', p.read_text())
          text = re.sub(r'v[0-9.]+ · cargando', 'v25.7.1 · cargando', text)
          p.write_text(text)
          PY
          for f in *.js *.mjs; do node --experimental-default-type=module --check "$f"; done
      - name: Install browser validation
        run: |
          npm install --prefix /tmp/release-smoke playwright
          /tmp/release-smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify menu, solo game and end-of-day report
        run: |
          python3 -m http.server 8765 >/tmp/game-server.log 2>&1 &
          node <<'JS'
          const { chromium } = require('/tmp/release-smoke/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/', {waitUntil:'networkidle'});
              await page.waitForFunction(() => document.getElementById('ver-title').textContent.includes('v25.7.1 · activas:'));
              await page.click('#btn-start');
              await page.waitForFunction(() => window.Game.mode === 'plan');
              await page.click('#btn-open');
              await page.waitForFunction(() => window.Game.mode === 'service');
              await page.evaluate(() => window.__api.endDay());
              await page.waitForFunction(() => window.Game.mode === 'report' && document.getElementById('rep-body').textContent.includes('Resultado del día'));
              if(errors.length) throw new Error(errors.join('\n'));
            } finally { await browser.close(); }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - name: Commit tested release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.js' '*.mjs' index.html
          git diff --cached --quiet || git commit -m 'v25.7.1: validated module loading and consistent version'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deploy
