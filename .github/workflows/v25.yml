name: Apply tested v25
on:
  push:
    branches: [feature/reputacion-historial-social]
    paths: [apply-v25.py, .github/workflows/v25.yml]
permissions:
  contents: write
concurrency:
  group: v25
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reputacion-historial-social
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply, check and test
        id: run
        run: |
          set +e
          ok=true
          {
            python3 apply-v25.py || ok=false
            if [ "$ok" = true ]; then
              for f in report.js v12.js cierre-ui.js chiringo-ui.js progression-ui.js saves.js game.js social-model.js ratings-model.mjs progression-model.mjs opinions-model.mjs; do
                node --experimental-default-type=module --check "$f" || { echo "SYNTAX FAIL $f"; ok=false; }
              done
              for t in v25 tab-persist smoke social-model career progression market service-v24; do
                echo "== $t"; node --experimental-default-type=module $t.test.mjs || { echo "TEST FAIL $t"; ok=false; }
              done
            fi
            echo "RESULT ok=$ok"
          } > /tmp/v25-run.txt 2>&1
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${{ steps.run.outputs.ok }}" != "true" ]; then git checkout -- .; fi
          mkdir -p diagnostics
          cp /tmp/v25-run.txt diagnostics/v25-run.txt
          git add diagnostics/v25-run.txt
          if [ "${{ steps.run.outputs.ok }}" = "true" ]; then
            git rm -q cierre-ui.v25.js
            git add ratings-model.mjs social-model.js progression-model.mjs progression-ui.js saves.js report.js v12.js cierre-ui.js chiringo-ui.js game.js index.html
            git commit -m "v25: opiniones separadas, reputación gradual, historial coherente, balance real de Chiringo y red social sin estrellas"
          else
            git commit -m "v25: la comprobación falló; ver diagnostics/v25-run.txt (no se aplicó ningún cambio)"
          fi
          git push origin HEAD:feature/reputacion-historial-social
