name: Service 3D integrity
on:
  push:
    branches: [fix/3d-service-integrity, experiment/vfx-clientes-3d]
  pull_request:
    paths:
      - 'service-3d*'
      - 'stations-3d.js'
      - 'controls-3d.js'
      - 'sim/**'
      - 'net-sync.js'
      - 'net-link.js'
      - 'net-movement-3d.js'
      - 'movement-3d-model.mjs'
      - 'render-3d.js'
      - 'ui-service.js'
      - 'online-3d.browser.test.mjs'
      - '.github/workflows/service-3d-checks.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulation and active-service regressions
        run: npm test
