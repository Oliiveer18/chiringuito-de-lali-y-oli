name: Restore original game
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-original.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: restore-original
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert only v25.8 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit 99d7a72ed350d9992fd7899b4a60cb4d1a104012
          git diff --exit-code 43446a9fdab88900fa8a22b8ad502a66152ebe3f -- index.html ui.js
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
