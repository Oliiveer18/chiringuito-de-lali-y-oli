name: Bump preview redesign revision
on:
  push:
    branches: [project/redesign-visual]

permissions:
  contents: write

concurrency:
  group: preview-redesign-revision-bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record redesign branch tip
        run: echo "${{ github.sha }}" > .github/preview-redesign-revision

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/preview-redesign-revision
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump preview redesign revision for Pages"
          git push origin HEAD:main
