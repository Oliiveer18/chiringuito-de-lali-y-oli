name: camera-beta checks
on:
  push:
    branches: [camera-beta]
permissions:
  contents: write
concurrency:
  group: camera-beta
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: camera-beta
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural and syntax checks
        run: |
          node camera-beta.test.mjs
          for f in camera-beta.js gamefeel.js player.js netplayer.js balance.js game.js; do node --experimental-default-type=module --check "$f"; done
      - name: Run existing regression suite
        run: |
          node --experimental-default-type=module smoke.test.mjs
          node social-model.test.mjs
          node --experimental-default-type=module career.test.mjs
          node progression.test.mjs
          node market.test.mjs
          node service-v24.test.mjs
      - name: Create deployment marker
        run: |
          echo "camera-beta ready $(date -u +%FT%TZ) commit ${GITHUB_SHA}" > camera-beta-ready.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add camera-beta-ready.txt
          git diff --cached --quiet || git commit -m "camera-beta: verificación completa superada"
          git push origin HEAD:camera-beta
