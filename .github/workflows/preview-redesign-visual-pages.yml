name: Preview rediseño v29 (Pages)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/preview-redesign-visual-pages.yml
      - .github/preview-redesign-revision

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-redesign
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout main (site root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Resolve preview source revision
        id: rev
        run: |
          sha="$(tr -d '[:space:]' < site/.github/preview-redesign-revision)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout redesign (preview source)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}
          path: preview-src

      - name: Compose site with preview subfolder
        run: |
          rsync -a --delete --exclude='.git' preview-src/ site/preview/
          if rg -q 'href="/|src="/|fetch\(\x27/|fetch\("/' site/preview/index.html site/preview/game.js 2>/dev/null; then
            sed -i 's|<head>|<head>\n<base href="/chiringuito-de-lali-y-oli/preview/">|' site/preview/index.html
          fi
          test -f site/index.html
          test -f site/preview/index.html
          grep -q 'style.css?v=28.' site/index.html
          grep -q 'style.css?v=29.1' site/preview/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment

      - run: |
          echo "page_url=${{ steps.deployment.outputs.page_url }}"
          echo "preview=${{ steps.deployment.outputs.page_url }}/preview/index.html"
