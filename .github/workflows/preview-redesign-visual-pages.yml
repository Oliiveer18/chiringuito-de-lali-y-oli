name: Preview rediseño v29 (Pages)
on:
  workflow_dispatch:
  push:
    branches: [project/redesign-visual]

permissions:
  contents: write

concurrency:
  group: preview-redesign-publish-main
  cancel-in-progress: true

jobs:
  publish-preview-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve redesign source SHA
        id: rev
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/project/redesign-visual" ]; then
            sha="${{ github.sha }}"
          else
            sha="$(tr -d '[:space:]' < .github/preview-redesign-revision)"
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout redesign (preview source)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}
          path: preview-src

      - name: Sync preview/ on main (keep root game unchanged)
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            preview-src/ preview/
          if rg -q 'href="/|src="/|fetch\(\x27/|fetch\("/' preview/index.html preview/game.js 2>/dev/null; then
            sed -i 's|<head>|<head>\n<base href="/chiringuito-de-lali-y-oli/preview/">|' preview/index.html
          fi
          touch .nojekyll
          echo "${{ steps.rev.outputs.sha }}" > .github/preview-redesign-revision
          test -f index.html
          test -f preview/index.html
          grep -q 'style.css?v=28.' index.html
          grep -q 'style.css?v=29.1' preview/index.html
          ! cmp -s index.html preview/index.html

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/ .github/preview-redesign-revision .nojekyll
          git diff --cached --quiet && echo "No preview changes to publish" && exit 0
          git commit -m "chore: publish preview redesign at preview/ (${{ steps.rev.outputs.sha }})"
          git push origin HEAD:main
