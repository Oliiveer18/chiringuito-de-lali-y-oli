name: camera-beta folder checks
on:
  push:
    branches: [main]
    paths: ['camera-beta/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node camera-beta/camera-beta.test.mjs
      - run: |
          for f in camera-beta/camera-beta.js camera-beta/gamefeel.js camera-beta/player.js camera-beta/netplayer.js camera-beta/balance.js camera-beta/game.js; do node --experimental-default-type=module --check "$f"; done
