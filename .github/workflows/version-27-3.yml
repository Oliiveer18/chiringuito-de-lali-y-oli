name: Update version to 27.3
on:
  push:
    paths: ['.github/workflows/version-27-3.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update version labels
        shell: python
        run: |
          from pathlib import Path
          for name in ['index.html', 'version.js']:
              p = Path(name)
              p.write_text(p.read_text().replace('v27.2', 'v27.3'))
      - name: Commit version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.js
          git diff --cached --quiet || git commit -m 'Update visible version and entry URL to v27.3'
          git push origin HEAD:main
